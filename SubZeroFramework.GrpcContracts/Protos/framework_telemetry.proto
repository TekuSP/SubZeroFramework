message SetFanRpmRequest {
  int32 fan_index = 1;
  int32 target_speed_rpm = 2;
}

message SetFanRpmReply {
  int32 fan_index = 1;
  int32 applied_speed_rpm = 2;
}

message SetFanDutyRequest {
  int32 fan_index = 1;
  double duty_percent = 2;
  // When true, actuate the EC live but do not persist the override to the configuration store
  // (a volatile "preview"); a service restart restores the last applied state.
  bool preview = 3;
}

message SetFanDutyReply {
  int32 fan_index = 1;
  double applied_duty_percent = 2;
}

message SetFanMaxRequest {
  int32 fan_index = 1;
  // When true, actuate the EC live but do not persist (volatile preview). See SetFanDutyRequest.preview.
  bool preview = 2;
}

message SetFanMaxReply {
  int32 fan_index = 1;
  double applied_duty_percent = 2;
}

message SetFanCustomCurveRequest {
  int32 fan_index = 1;
  map<int32, double> curve_points = 2;
  repeated int32 driving_sensor_indices = 3;
  TemperatureAggregationModeValue driving_temperature_aggregation = 4;
  // When true, actuate the EC live but do not persist (volatile preview). See SetFanDutyRequest.preview.
  bool preview = 5;
  // See FanCurveProfileReply.treat_missing_sensors_as_zero.
  bool treat_missing_sensors_as_zero = 6;
}

message SetFanCustomCurveReply {
  int32 fan_index = 1;
  bool succeeded = 2;
  string message = 3;
}

message RestoreAutoFanControlRequest {
  int32 fan_index = 1;
  // When true, actuate the EC live but do not persist (volatile preview). See SetFanDutyRequest.preview.
  bool preview = 2;
}

message RestoreAutoFanControlReply {
  int32 fan_index = 1;
}

message HoldFanPreviewRequest {
  int32 fan_index = 1;
}

message HoldFanPreviewReply {
  // The first reply signals the hold is established and the pre-preview state has been captured, so the
  // client may safely send its preview command. Further replies (if any) are keepalives.
  bool ready = 1;
}

// One per-fan curve profile slot. An unconfigured slot has is_configured = false.
message FanCurveProfileReply {
  int32 fan_index = 1;
  int32 slot = 2;
  string name = 3;
  bool is_configured = 4;
  repeated FanCurvePointReply points = 5;
  repeated int32 driving_sensor_indices = 6;
  TemperatureAggregationModeValue aggregation = 7;
  // When set, this slot mirrors the active curve of follow_fan_index instead of using its own points.
  bool has_follow_target = 8;
  int32 follow_fan_index = 9;
  // A driving sensor with no reading (powered down, erroring) counts as 0 C instead of being skipped. Suits
  // sensors that go dark because what they measure is switched off — a sleeping GPU reports no heat.
  bool treat_missing_sensors_as_zero = 10;
}

message SaveFanCurveProfileRequest {
  int32 fan_index = 1;
  int32 slot = 2;
  string name = 3;
  map<int32, double> curve_points = 4;
  repeated int32 driving_sensor_indices = 5;
  TemperatureAggregationModeValue driving_temperature_aggregation = 6;
  bool has_follow_target = 7;
  int32 follow_fan_index = 8;
  // When true, also make this the active slot and switch the fan into curve mode.
  bool activate = 9;
  // See FanCurveProfileReply.treat_missing_sensors_as_zero.
  bool treat_missing_sensors_as_zero = 10;
}

message SetActiveFanCurveProfileRequest {
  int32 fan_index = 1;
  int32 slot = 2;
}

message ClearFanCurveProfileRequest {
  int32 fan_index = 1;
  int32 slot = 2;
}

message SetFanLinkRequest {
  int32 fan_index = 1;
  // Unset clears the link (the fan becomes independent); set groups it under that leader.
  optional int32 linked_leader_index = 2;
}

message FanCurveProfileOperationReply {
  int32 fan_index = 1;
  int32 slot = 2;
  bool succeeded = 3;
  string message = 4;
}

message SetFanAdaptiveModeRequest {
  int32 fan_index = 1;
  // The driving sensors the loop holds. Same meaning as on a curve profile.
  repeated int32 driving_sensor_indices = 2;
  TemperatureAggregationModeValue driving_temperature_aggregation = 3;
  // Optional: when unset the fan keeps whatever Adaptive settings it already had.
  optional AdaptiveFanSettingsMessage settings = 4;
  // When true, arm the loop live but do not persist (volatile preview) — the same contract as
  // SetFanCustomCurveRequest.preview, and the reason previewing Adaptive is possible at all: without it the
  // stage-preview-apply flow every other mode has ended, for this one, in an error bar.
  bool preview = 5;
}

message SetFanAdaptiveSettingsRequest {
  int32 fan_index = 1;
  AdaptiveFanSettingsMessage settings = 2;
}

message ReleaseFanThrottleLatchRequest {
  int32 fan_index = 1;
}

message ForgetFanAdaptiveLearningRequest {
  int32 fan_index = 1;
}

message AdaptiveFanSettingsMessage {
  double target_temperature_celsius = 1;
  bool safety_floor_enabled = 2;
  double safety_floor_percent = 3;
}

// A fan's learned thermal model. A state of NONE means the fan has never been calibrated and is not yet
// adaptively driven; BOOTSTRAP means it is running on the conservative built-in model and learning from
// ordinary use. Neither locks Adaptive out.
message FanCalibrationMessage {
  FanCalibrationStateValue state = 1;
  int64 calibrated_at_unix_time_milliseconds = 2;
  double process_gain_celsius_per_percent = 3;
  double time_constant_seconds = 4;
  double dead_time_seconds = 5;
  double minimum_spin_rpm = 6;
  double minimum_spin_duty_percent = 7;
  double maximum_rpm = 8;
  double proportional_gain = 9;
  double integral_gain = 10;
  double feed_forward_duty_per_watt = 11;
  FanSpeedTrackingModeValue tracking_mode = 12;
  // What the extra fan bought in sustained speed. Absent on calibrations from before this was measured, and
  // on machines that report no clock at all.
  optional FanPerformanceResponseMessage performance_response = 13;
}

// Sustained speed at a low fan duty against sustained speed at full duty, measured across the same step the
// thermal model is fitted from. Answers "what do I get for the noise?", which the temperature model cannot:
// a machine limited by its power budget rather than its heatsink runs cooler at full fan and no faster.
message FanPerformanceResponseMessage {
  double low_duty_percent = 1;
  double full_duty_percent = 2;
  // Clock as a fraction of base. Below 1 means the processor was being held back.
  optional double cpu_performance_ratio_at_low_duty = 3;
  optional double cpu_performance_ratio_at_full_duty = 4;
  optional double gpu_core_clock_at_low_duty_megahertz = 5;
  optional double gpu_core_clock_at_full_duty_megahertz = 6;
}

// One adaptive controller tick, decomposed. This is what makes an adaptive fan explainable: the terms sum to
// raw_duty_percent, and the UI renders them as a stacked bar.
message AdaptiveControlMessage {
  double feed_forward_duty_percent = 1;
  double proportional_integral_duty_percent = 2;
  double lead_duty_percent = 3;
  double throttle_escalation_duty_percent = 4;
  double raw_duty_percent = 5;
  double duty_percent = 6;
  // Present only under cascade tracking, where a speed rather than a duty is commanded.
  optional double setpoint_rpm = 7;
  double driving_temperature_celsius = 8;
  double target_temperature_celsius = 9;
  bool is_throttle_latched = 10;
  int64 throttle_latched_at_unix_time_milliseconds = 11;
  optional double throttle_latch_release_seconds = 12;
  // True when no CPU package power reading was available, so the loop is running on feedback alone.
  bool is_feed_forward_unavailable = 13;
}

// What ordinary running has refined since the calibration run.
message AdaptiveLearningMessage {
  optional double feed_forward_duty_per_watt = 1;
  optional double calibrated_anchor_duty_per_watt = 2;
  int32 observation_count = 3;
  int64 last_updated_at_unix_time_milliseconds = 4;
  // The identified plant. Absent until the settled samples span enough of both duty and power for the fit
  // to be separable — which is exactly the Learning state.
  optional double identified_process_gain_celsius_per_percent = 5;
  optional double identified_celsius_per_watt = 6;
  // When the model last moved MATERIALLY, as opposed to the per-sample jitter last_updated_at tracks. This
  // is what "stable for {n} days" means.
  int64 last_material_change_at_unix_time_milliseconds = 7;
  // Derived server-side so every client agrees on the wording; see AdaptiveConfidence.
  AdaptiveConfidenceValue confidence = 8;
}

enum AdaptiveConfidenceValue {
  ADAPTIVE_CONFIDENCE_VALUE_LEARNING = 0;
  ADAPTIVE_CONFIDENCE_VALUE_CONVERGING = 1;
  ADAPTIVE_CONFIDENCE_VALUE_CONFIDENT = 2;
}

enum FanCalibrationStateValue {
  FAN_CALIBRATION_STATE_VALUE_NONE = 0;
  FAN_CALIBRATION_STATE_VALUE_OK = 1;
  FAN_CALIBRATION_STATE_VALUE_STALE = 2;
  // Running on the conservative built-in model because the fan has never been calibrated. Distinct from NONE
  // on purpose: NONE is "no model", BOOTSTRAP is "a deliberately cautious model that works and is learning".
  // Collapsing the two would make a working adaptive fan look broken.
  FAN_CALIBRATION_STATE_VALUE_BOOTSTRAP = 3;
}

message RunFanCalibrationRequest {
  int32 fan_index = 1;
  // The sensors whose hottest reading the run measures against — the same ones Adaptive will hold.
  repeated int32 driving_sensor_indices = 2;
  // What to heat: 1 = CPU, 2 = GPU, matching ThermalLoadTarget. Absent means the service decides from the
  // fan's cooling role, which is what it did before this was askable — a fan whose role is known needs no
  // help. Present when the user has chosen, because the role is a guess on hardware nobody has mapped, and
  // heating the wrong component wastes a five-minute run that could never have measured anything.
  optional int32 load_target = 3;
}

// One update from a running calibration. Carries the live readings as well as the step, so the client can
// plot the response as it happens: watching the temperature actually move is what makes a multi-minute wait
// tolerable, and is the only way a user can tell a run that is working from one about to fail for lack of load.
message FanCalibrationProgressReply {
  int32 fan_index = 1;
  FanCalibrationStepValue step = 2;
  // How many steps there are, so no client hard-codes a count that can drift.
  int32 step_count = 3;
  double elapsed_seconds = 4;
  optional double temperature_celsius = 5;
  optional double speed_rpm = 6;
  optional double package_power_watts = 7;
  // Set on the update where the fan was stepped, so the plot can mark it.
  bool is_step_marker = 8;
  optional int64 estimated_remaining_milliseconds = 9;

  // False on every progress update; true on the single final message, which carries the outcome below.
  bool is_complete = 10;
  bool succeeded = 11;
  FanCalibrationFailureValue failure = 12;
  // The identified model, present only on a successful final message.
  optional FanCalibrationMessage calibration = 13;
  // Measured values, reported on BOTH outcomes. A failure saying "the machine never got busy enough" without
  // saying how busy it did get gives the user nothing to act on — and this run costs them several minutes.
  optional double average_package_power_watts = 14;
  optional double temperature_swing_celsius = 15;
  optional double peak_temperature_celsius = 16;
  int64 duration_milliseconds = 17;
  // Whether the fan was returned to the control it had before the run. Shown on every failure screen: a
  // calibration drives the fan to extremes, so this is the one fact a failure must never leave ambiguous.
  bool fans_restored = 18;
  // The duty the run has commanded. Not readable back from the hardware — the tachometer reports speed,
  // which lags it and is scaled differently — so this is the only way a client can plot the step the
  // temperature curve is responding to.
  optional double duty_percent = 19;
  // How far through the whole run this is, 0–1. Time-weighted by the schedule rather than derived from the
  // step number: the steps are nothing like equal length, so counting them makes the bar lurch and then sit
  // still for minutes. Computed by the runner and previously never sent, which left the bar at zero.
  double overall_progress = 20;
  // True when power_watts is a WHOLE-SYSTEM reading rather than the processor package. The package figure is
  // not available on every platform, and the run falls back to system power so it can still measure — but
  // presenting a 240 W adapter draw as "package power" is a different number wearing the wrong name.
  bool power_is_system_wide = 21;
  // The clock of the component the run is HEATING — CPU clock on a CPU-load run, GPU core clock on a
  // GPU-load run. Which one it is needs no flag: the client chose the load target when it started the run.
  optional double clock_megahertz = 22;
  // Busy share of that same component, in canonical percent. Together with the clock this is what lets the
  // live plots answer "did the load actually take": a run that never gets busy is visible minutes before it
  // fails for an insufficient temperature swing.
  optional double utilization_percent = 23;
}

// The stages of a run, in execution order. The ordering is physics, not presentation: identifying K requires
// varying DUTY while everything else holds still, so the load is applied and allowed to settle FIRST.
enum FanCalibrationStepValue {
  FAN_CALIBRATION_STEP_VALUE_NONE = 0;
  FAN_CALIBRATION_STEP_VALUE_SETTLING_AT_IDLE = 1;
  FAN_CALIBRATION_STEP_VALUE_FINDING_MINIMUM_SPIN = 2;
  FAN_CALIBRATION_STEP_VALUE_LOADING_AND_SETTLING = 3;
  FAN_CALIBRATION_STEP_VALUE_STEPPING_FAN = 4;
  FAN_CALIBRATION_STEP_VALUE_MEASURING_RESPONSE = 5;
  FAN_CALIBRATION_STEP_VALUE_FITTING_MODEL = 6;
  FAN_CALIBRATION_STEP_VALUE_VERIFYING_SPEED_TRACKING = 7;
  FAN_CALIBRATION_STEP_VALUE_COMPLETED = 8;
  // Appended (wire values are forever) even though it EXECUTES before COMPLETED. Its absence was visible:
  // the server mapped the sweep to NONE and the dialog showed "Step 0 of 8" for the whole phase.
  FAN_CALIBRATION_STEP_VALUE_MEASURING_GAIN_CURVE = 9;
  // Between attempts: heat off, every fan under firmware, waiting for the machine to cool before retrying
  // with more sibling airflow. Not a numbered step — the client presents it as a pause, not progress.
  FAN_CALIBRATION_STEP_VALUE_COOLING_DOWN = 10;
}

enum FanCalibrationFailureValue {
  FAN_CALIBRATION_FAILURE_VALUE_NONE = 0;
  FAN_CALIBRATION_FAILURE_VALUE_INSUFFICIENT_LOAD = 1;
  FAN_CALIBRATION_FAILURE_VALUE_INSUFFICIENT_TEMPERATURE_SWING = 2;
  FAN_CALIBRATION_FAILURE_VALUE_TEMPERATURE_CEILING = 3;
  FAN_CALIBRATION_FAILURE_VALUE_CANCELLED = 4;
  FAN_CALIBRATION_FAILURE_VALUE_CLIENT_DISCONNECTED = 5;
  FAN_CALIBRATION_FAILURE_VALUE_INSUFFICIENT_DATA = 6;
  FAN_CALIBRATION_FAILURE_VALUE_ON_BATTERY = 7;
  // The fan is controlled by GPU sensors and this machine cannot generate GPU load. Reported rather than
  // silently substituting CPU load, which would heat something this fan does not cool.
  FAN_CALIBRATION_FAILURE_VALUE_GPU_LOAD_UNAVAILABLE = 8;
}

