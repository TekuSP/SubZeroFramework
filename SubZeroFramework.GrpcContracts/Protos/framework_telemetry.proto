  optional int32 linked_leader_index = 20;
  // Active slot's setting; see FanCurveProfileReply.treat_missing_sensors_as_zero.
  bool treat_missing_sensors_as_zero = 22;

  // Adaptive mode. The calibration is configuration and changes rarely; adaptive_control is LIVE telemetry
  // republished every controller tick, and is absent whenever the fan is not adaptively driven.
  optional FanCalibrationMessage calibration = 23;
  optional AdaptiveFanSettingsMessage adaptive_settings = 24;
  optional AdaptiveControlMessage adaptive_control = 25;
  optional AdaptiveLearningMessage adaptive_learning = 26;

  // What the fan cools, as opposed to where it sits. display_name gives the position ("Right fan"); this
  // gives the purpose ("GPU fan"), which is what decides the component a calibration must heat.
  FanCoolingRoleValue cooling_role = 27;

