syntax = "proto3";

option csharp_namespace = "SubZeroFramework.GrpcContracts";

package subzeroframework.grpc;

service FrameworkStatusService {
  rpc GetStatus (GetStatusRequest) returns (FrameworkStatusReply);
  rpc WatchStatus (WatchStatusRequest) returns (stream FrameworkStatusReply);
}

service FrameworkServiceConfigurationService {
  rpc GetServiceConfiguration (GetServiceConfigurationRequest) returns (FrameworkServiceConfigurationReply);
  rpc WatchServiceConfiguration (WatchServiceConfigurationRequest) returns (stream FrameworkServiceConfigurationReply);
  rpc ApplyServiceConfiguration (ApplyServiceConfigurationRequest) returns (ServiceConfigurationOperationReply);
  rpc SaveServiceConfiguration (SaveServiceConfigurationRequest) returns (ServiceConfigurationOperationReply);
  rpc LoadServiceConfiguration (LoadServiceConfigurationRequest) returns (ServiceConfigurationOperationReply);
  rpc RelocateServiceConfiguration (RelocateServiceConfigurationRequest) returns (ServiceConfigurationOperationReply);
  // The service's own log since it started, from a bounded in-memory buffer. A snapshot, not a stream: the
  // app shows it on demand rather than tailing a several-times-a-second log into a list view.
  rpc GetServiceLogs (GetServiceLogsRequest) returns (ServiceLogsReply);
}

service FrameworkTelemetryService {
  rpc WatchFanCapabilities (WatchFanCapabilitiesRequest) returns (stream FanCapabilityChangeBatchReply);
  rpc WatchFanControlStates (WatchFanControlStatesRequest) returns (stream FanControlStateChangeBatchReply);
  rpc WatchFanStates (WatchFanStatesRequest) returns (stream FanStateChangeBatchReply);
  rpc WatchTelemetryChannels (WatchTelemetryChannelsRequest) returns (stream TelemetryChannelChangeBatchReply);
  rpc WatchCurrentTelemetryValues (WatchCurrentTelemetryValuesRequest) returns (stream CurrentTelemetryValueChangeBatchReply);
  rpc WatchTelemetrySeries (WatchTelemetrySeriesRequest) returns (stream TelemetrySeriesPointChangeBatchReply);
  rpc WatchPowerDelivery (WatchPowerDeliveryRequest) returns (stream PowerDeliveryReply);
  rpc WatchModuleInventory (WatchModuleInventoryRequest) returns (stream ModuleInventoryReply);
}

service HardwareInfoService {
  rpc GetHardwareInfo (GetHardwareInfoRequest) returns (HardwareInfoReply);
  rpc WatchHardwareInfo (WatchHardwareInfoRequest) returns (stream HardwareInfoReply);
  rpc WatchHardwareInfoHistory (WatchHardwareInfoHistoryRequest) returns (stream HardwareInfoHistoryChangeBatchReply);
}

service FrameworkFanControlService {
  rpc SetFanRpm (SetFanRpmRequest) returns (SetFanRpmReply);
  rpc SetFanDuty (SetFanDutyRequest) returns (SetFanDutyReply);
  rpc SetFanMax (SetFanMaxRequest) returns (SetFanMaxReply);
  rpc SetFanCustomCurve (SetFanCustomCurveRequest) returns (SetFanCustomCurveReply);
  rpc RestoreAutoFanControl (RestoreAutoFanControlRequest) returns (RestoreAutoFanControlReply);
  // Per-fan curve profile slots (up to 5 unique slots per fan, with an optional per-slot follow target).
  rpc SaveFanCurveProfile (SaveFanCurveProfileRequest) returns (FanCurveProfileOperationReply);
  rpc SetActiveFanCurveProfile (SetActiveFanCurveProfileRequest) returns (FanCurveProfileOperationReply);
  rpc ClearFanCurveProfile (ClearFanCurveProfileRequest) returns (FanCurveProfileOperationReply);
  // "Applies to" group membership: set (or clear, when linked_leader_index is unset) which fan this one is
  // grouped under. Persisted so the grouping survives restarts and streams back via linked_leader_index.
  rpc SetFanLink (SetFanLinkRequest) returns (FanCurveProfileOperationReply);
  // Adaptive mode: arm a calibrated fan into closed-loop control, and set the target temperature and safety
  // floor it holds. An uncalibrated fan arms on a conservative bootstrap model and learns from ordinary use;
  // only a fan with no driving sensor is rejected, because there is nothing for the loop to hold.
  rpc SetFanAdaptiveMode (SetFanAdaptiveModeRequest) returns (FanCurveProfileOperationReply);
  // Update the Adaptive knobs without changing the fan's mode. Persisted; kept across mode switches.
  rpc SetFanAdaptiveSettings (SetFanAdaptiveSettingsRequest) returns (FanCurveProfileOperationReply);
  // Clears a latched throttle escalation for one fan. Immediate, never staged, and NOT persisted — if the
  // processor is still throttling the next controller tick latches again, which is the correct outcome.
  rpc ReleaseFanThrottleLatch (ReleaseFanThrottleLatchRequest) returns (FanCurveProfileOperationReply);
  // Discards what a fan identified from ordinary use, returning it to its calibration — or, when it has
  // none, to the conservative bootstrap. Destructive and immediate. For a machine that changed physically
  // (new heatsink, repaste) where the old model describes hardware that no longer exists.
  rpc ForgetFanAdaptiveLearning (ForgetFanAdaptiveLearningRequest) returns (FanCurveProfileOperationReply);
  // Runs the hot test that identifies a fan's thermal model: load the machine, step the fan, watch the
  // temperature fall, fit K, tau and L. Several minutes long and physically consequential — it deliberately
  // heats the machine and drives the fan to extremes.
  //
  // Streaming is not decoration. The client's live stream IS the run's lease: cancelling the call, or simply
  // disconnecting, aborts the run, stops the load, and hands the fan back. A unary call could not express
  // that, and a run whose client has gone away must not keep heating an unattended machine.
  //
  // The final message carries is_complete with the outcome; every message before it is progress.
  rpc RunFanCalibration (RunFanCalibrationRequest) returns (stream FanCalibrationProgressReply);
  // Preview safety lease: the client keeps this server stream open while a volatile preview is live. The
  // service captures the fan's pre-preview state when the stream opens, and if the stream breaks before the
  // preview is committed (Apply) or explicitly released, it reverts the fan to that captured state. This
  // covers an app crash or kill mid-preview so the EC is never left stuck on an unapplied preview.
  rpc HoldFanPreview (HoldFanPreviewRequest) returns (stream HoldFanPreviewReply);
  // Battery charge floor/ceiling. Get is a plain read; Set is an EC write gated by the same authorization.
  rpc GetChargeLimits (GetChargeLimitsRequest) returns (ChargeLimitsReply);
  rpc SetChargeLimits (SetChargeLimitsRequest) returns (ChargeLimitsReply);
  // Factory reset of all fan control state: every fan goes back to EC automatic control and every persisted
  // fan setting is deleted (curve profile slots, active slot, "applies to" links, and manual/max overrides),
  // including entries for fan indices that no longer enumerate. Never a preview — it always persists.
  rpc ResetFanControlToFactoryDefaults (ResetFanControlToFactoryDefaultsRequest) returns (ResetFanControlToFactoryDefaultsReply);
}

message GetStatusRequest {
}

message WatchStatusRequest {
}

message GetServiceConfigurationRequest {
}

message WatchServiceConfigurationRequest {
}

message ApplyServiceConfigurationRequest {
  // The three sensor-polling tiers. Field 4 was added after 1 and 2, so it is out of tier order on the wire
  // deliberately — renumbering would break older clients.
  int64 polling_interval_milliseconds = 1;            // PRIMARY
  int64 hardware_info_polling_interval_milliseconds = 2; // TERTIARY
  bool allow_fan_control_commands = 3;
  int64 secondary_polling_interval_milliseconds = 4;  // SECONDARY
  // How long each tier's samples are kept for history. Zero means "unset" — an older client that does not
  // send these must not be read as asking to retain nothing, so the service keeps what it already had.
  int64 primary_retention_minutes = 5;
  int64 secondary_retention_minutes = 6;
  int64 tertiary_retention_minutes = 7;
}

message SaveServiceConfigurationRequest {
}

message LoadServiceConfigurationRequest {
}

message RelocateServiceConfigurationRequest {
  string target_directory = 1;
}

message FrameworkServiceConfigurationReply {
  int64 polling_interval_milliseconds = 1;            // PRIMARY
  int64 hardware_info_polling_interval_milliseconds = 2; // TERTIARY
  bool allow_fan_control_commands = 3;
  string persistent_configuration_path = 4;
  int64 secondary_polling_interval_milliseconds = 5;  // SECONDARY
  int64 primary_retention_minutes = 6;
  int64 secondary_retention_minutes = 7;
  int64 tertiary_retention_minutes = 8;
}

message ServiceConfigurationOperationReply {
  bool succeeded = 1;
  string message = 2;
  FrameworkServiceConfigurationReply configuration = 3;
}

