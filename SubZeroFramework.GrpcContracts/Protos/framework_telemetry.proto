message HardwareInfoCpuReply {
  string name = 1;
  string caption = 2;
  string description = 3;
  string manufacturer = 4;
  uint32 cores = 5;
  uint32 logical_processors = 6;
  uint32 current_clock_speed_mhz = 7;
  uint32 max_clock_speed_mhz = 8;
  string processor_id = 9;
  string socket_designation = 10;
  uint32 l1_cache_size_kb = 11;
  uint32 l2_cache_size_kb = 12;
  uint32 l3_cache_size_kb = 13;
  bool second_level_address_translation_extensions = 14;
  bool virtualization_firmware_enabled = 15;
  bool vm_monitor_mode_extensions = 16;
  optional double percent_processor_time = 17;
  repeated HardwareInfoCpuCoreReply cpu_cores = 18;
  // Processor package power. From the platform's RAPL package domain on both platforms — powercap sysfs on
  // Linux, the Energy Meter counter set on Windows — so neither needs a kernel driver. Absent where the
  // firmware exposes no energy meter, and on a multi-package machine, where a machine-wide reading cannot
  // honestly be attributed to one socket.
  optional double package_power_watts = 19;
}

