  FanNameValue fan_name = 27;

  // GPU / NPU extended telemetry, carried on the device's utilization channel so one reading stays atomic.
  // Present only where the source can report it: the Windows PDH counter set has no power, temperature or
  // clock at all, so on Windows these are populated for an NVIDIA GPU (via NVML) and absent otherwise.
  bool has_compute_power_watts = 28;
  double compute_power_watts = 29;
  bool has_compute_temperature_celsius = 30;
  double compute_temperature_celsius = 31;
  bool has_compute_core_clock_megahertz = 32;
  double compute_core_clock_megahertz = 33;
  bool has_compute_max_core_clock_megahertz = 34;
  double compute_max_core_clock_megahertz = 35;
  // Bitmask of ComputeThrottleReasonsValue. has_* distinguishes "nothing is throttling" (present, zero) from
  // "the source could not say" (absent) — the two mean very different things to a fan controller.
  bool has_compute_throttle_reasons = 36;
  uint32 compute_throttle_reasons = 37;
  // Video memory in use and total, in bytes. Usage rather than memory-bandwidth utilisation, because that is
  // the one meaning both vendors can report.
