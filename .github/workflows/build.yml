name: Build, test and package

# Reusable. Holds the ENTIRE build pipeline — version, both app heads, tests, packaging, smoke test —
# and is called by ci.yml (push/PR) and release.yml (a created GitHub Release). Splitting it this way
# rather than into a second standalone workflow is deliberate: `needs:` cannot cross workflow files, and
# artifacts belong to a run, so a standalone release workflow would have to re-download them from
# another run by id. A called workflow shares the caller's run, so the release job can simply
# `needs:` these jobs and download their artifacts normally.
#
# The `github` context here is the CALLER'S event, which is what lets the version job below keep
# reading github.event_name / github.event.release.tag_name unchanged.
on:
  workflow_call:
    outputs:
      version:
        description: 'Version stamped into every artifact this run produced.'
        value: ${{ jobs.version.outputs.version }}
      is_release:
        description: 'True when the caller was triggered by a created GitHub Release.'
        value: ${{ jobs.version.outputs.is_release }}

env:
  DOTNET_VERSION: '10.0.x'
  VERSION_PREFIX: '0.2'
  WINUI_PUBLISH_PROFILE: './SubZeroFramework/Properties/PublishProfiles/'
  SOLUTION_NAME: './SubZeroFramework/SubZeroFramework.csproj'
  # SOLUTION_NAME is the APP HEAD, which does not reference the tests, so the test project needs its own
  # restore and build before `dotnet test --no-restore --no-build` can run. It targets plain net10.0
  # (Core + Service + GrpcContracts + analyzers) — no Uno workloads, no RID, no -f.
  TEST_PROJECT: './SubZeroFramework.Tests/SubZeroFramework.Tests.csproj'
  ARTIFACT_OUTPUT: '${{ github.workspace }}/artifacts'
  GITHUB_TOKEN: ${{ secrets.GTH_EXTENDED_TOKEN }}

permissions:
  packages: write
  contents: read
  actions: write
  # dorny/test-reporter publishes the trx as a check run.
  checks: write

jobs:
  # Single source of truth for the version every job stamps. Ordinary branch/PR builds keep the
  # "<prefix>.<run_number>" scheme; a build triggered by creating a GitHub Release takes the version
  # from that release's tag, so a release tagged v0.1.0 stamps 0.1.0 rather than 0.1.<run>.
  # Every consumer MUST read needs.version.outputs.version — a job that references it without listing
  # `version` in its `needs:` silently resolves to an empty string, which becomes a bare
  # `-p:Version=` and a broken build.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - name: Resolve version
        id: resolve
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            version="${RELEASE_TAG#v}"
            # RPM Version: and Arch pkgver= both reject '-', so a prerelease tag would break Linux
            # packaging much later in the run. Fail here instead, where the cause is obvious.
            if [[ "${version}" == *-* ]]; then
              echo "::error::Prerelease tags are not supported yet: '${RELEASE_TAG}' contains '-', which RPM Version: and Arch pkgver= reject. Use a plain vX.Y.Z tag."
              exit 1
            fi
            if [[ -z "${version}" ]]; then
              echo "::error::Could not resolve a version from the release tag."
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            version="${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${version}"

  build_and_publish_windows:
    name: Build and publish app on Windows - (${{ matrix.type }})
    needs: [version]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: Windows
            runsOn: windows-latest
            platform: win-x64
            type: x64
          - os: Windows
            runsOn: windows-11-arm
            platform: win-arm64
            type: arm64

    runs-on: ${{ matrix.runsOn }}

    env:
      PUBLISH_DOTNET_TARGET_FRAMEWORK: 'net10.0-windows10.0.26100'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install UNO.Check
        run: dotnet tool install -g uno.check

      - name: Install UNO Workloads
        run: uno-check -v --ci --non-interactive --fix --target windows --skip vswin --skip vsmac --skip xcode --skip vswinworkloads --skip androidemulator --skip dotnetnewunotemplates

      # Skipped when the token is absent, which is every PR from a FORK: those runs get no secrets, so the
      # expression below resolves to an empty string and `dotnet nuget add source --password ""` exits 1
      # before a single project is compiled — the whole run then dies on a credential it never needed.
      # Nothing here requires the GitHub registry: every package this solution pins, FrameworkDotnet 0.8.213
      # included, resolves from nuget.org (verified with a clean package cache and nuget.org as the only
      # source). The registry stays configured for maintainer runs so a future private prerelease works, but
      # its absence must never be what fails a contributor's build.
      - name: Add GitHub Package Registry as a NuGet Source
        if: ${{ env.GITHUB_TOKEN != '' }}
        run: dotnet nuget add source --store-password-in-clear-text --name "GitHub" https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --username "${{ github.actor }}" --password "${{ env.GITHUB_TOKEN }}"

      # -p:Configuration=Release is required, not cosmetic: Uno.Sdk conditions the Uno.WinUI.DevServer
      # package reference on $(Optimize), which derives from Configuration. Restoring as Debug (the default)
      # writes a real DevServer reference into project.assets.json, and the Release build then fails
      # UNOB0019 for a package the restore it was handed had already committed to. Restore and build have to
      # agree on Configuration whenever a package reference is conditioned on it. Note `dotnet restore` has
      # no -c switch — it must be passed as a property.
      - name: Restore
        run: |
          dotnet restore ${{ env.SOLUTION_NAME }} -v normal -r ${{ matrix.platform }} -p:Configuration=Release -p:PublishReadyToRun=true -p:PublishProfile=${{ env.WINUI_PUBLISH_PROFILE }}${{ matrix.platform }}.pubxml
          dotnet restore ${{ env.TEST_PROJECT }} -v normal -p:Configuration=Release

      - name: Build
        run: |
          dotnet build --no-restore ${{ env.SOLUTION_NAME }} -v normal -c Release -f ${{ env.PUBLISH_DOTNET_TARGET_FRAMEWORK }} -p:PublishProfile=${{ env.WINUI_PUBLISH_PROFILE }}${{ matrix.platform }}.pubxml -p:Version=${{ needs.version.outputs.version }} -p:InformationalVersion=${{ needs.version.outputs.version }}+${{ github.sha }} -p:DebugSymbols=true -p:DebugType=portable
          # The version props are REQUIRED here, for the same reason as the service bundle below and with a
          # nastier failure. This build walks Tests -> Service -> GrpcContracts, and GrpcContracts is the one
          # shared project with a SINGLE TargetFramework: Core and Service are multi-targeted, so the app head
          # consumes their net10.0-windows10.0.26100 output while the tests consume their net10.0 output —
          # separate folders. GrpcContracts has only bin/Release/net10.0, so both consume the SAME FILE.
          # Without the version here, this step recompiled it at the Directory.Build.props default and
          # overwrote the copy the app had just been compiled against. `dotnet publish --no-build` below then
          # shipped that older stamp beside an app whose IL records the newer one, and CoreCLR refuses a lower
          # version at load with "Could not load file or assembly ... The system cannot find the file
          # specified." Shipped exactly that way in 0.2.1 — the installed app died on startup while every
          # local build worked, because nothing local builds the tests between the app build and its publish.
          dotnet build --no-restore ${{ env.TEST_PROJECT }} -v normal -c Release -p:Version=${{ needs.version.outputs.version }} -p:InformationalVersion=${{ needs.version.outputs.version }}+${{ github.sha }}

      # Tests run BETWEEN build and publish, so nothing is published from a red suite. --no-build binds
      # this to the exact assemblies built above rather than rebuilding a second, unverified copy.
      #
      # TestCategory!=Hardware excludes the load-generator tests, which drive the REAL CPU and GPU and then
      # assert the load landed where it was asked to. A shared, throttled, virtualised CI runner cannot hold
      # a steady 30% — one observed 22.2% against a 24.6% floor — so on CI they measure the runner, not the
      # code. They stay part of the local suite, where the machine is real and the number means something.
      - name: Test
        run: dotnet test --no-restore --no-build ${{ env.TEST_PROJECT }} -v normal -c Release --filter "TestCategory!=Hardware" --logger "trx;LogFileName=test-results.trx" --results-directory test-results

      # always(): a failed suite is exactly when the report is worth having. The Test step above has
      # already failed the job by then, so fail-on-error is off — it would only add a second, redundant
      # failure, and it also makes the reporter non-fatal on fork PRs, where GITHUB_TOKEN is read-only
      # and creating a check run is refused.
      - name: Publish test report
        if: ${{ always() }}
        uses: dorny/test-reporter@v3
        with:
          name: Tests (${{ matrix.os }} ${{ matrix.type }})
          # Workspace-RELATIVE with forward slashes, deliberately. This action globs with picomatch
          # semantics, where a backslash is an ESCAPE character, so an absolute Windows path
          # (D:\a\SubZeroFramework\...) can never match and the step fails with "No test report files
          # were found" even though dotnet test wrote the trx exactly where it was told to.
          path: test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Test results (${{ matrix.os }} ${{ matrix.type }})
          path: test-results
          # warn, not ignore: a silently absent trx is how the reporter's path bug hid itself.
          if-no-files-found: warn
          # Test results are tiny, so they keep a week for debugging failed runs, unlike the ~2 GB
          # build artifacts that are pure inter-job transport within one run.
          retention-days: 7

      - name: Publish
        run: dotnet publish --no-restore --no-build ${{ env.SOLUTION_NAME }} -v normal -c Release -f ${{ env.PUBLISH_DOTNET_TARGET_FRAMEWORK }} -p:PublishProfile=${{ env.WINUI_PUBLISH_PROFILE }}${{ matrix.platform }}.pubxml -p:PublishDir=${{ env.ARTIFACT_OUTPUT }} -p:Version=${{ needs.version.outputs.version }} -p:InformationalVersion=${{ needs.version.outputs.version }}+${{ github.sha }} -p:DebugSymbols=true -p:DebugType=portable

      - name: Package Windows service bundle
        shell: pwsh
        # -Version is required: this script is the ONLY place the service is ever built, so omitting it
        # let the service fall back to <Version> in Directory.Build.props while the app and installer
        # were stamped with the CI version — one installer shipping the product at two versions.
        run: ./SubZeroFramework.Service/Scripts/package-windows-service.ps1 -RuntimeIdentifier ${{ matrix.platform }} -OutputRoot "${{ env.ARTIFACT_OUTPUT }}" -Configuration Release -Version ${{ needs.version.outputs.version }}

      # The two version notes above are both reactions to the same failure: one step builds a shared project
      # at a different stamp than the step that compiled against it. Neither note can stop the NEXT variant,
      # because the mismatch is invisible until the installed app is launched on someone else's machine —
      # every CI step is green, the payload looks complete, and the DLL is right there in the folder.
      # So assert it. This runs on the assembled payload, after everything that writes into it.
      - name: Verify payload assembly versions
        shell: pwsh
        run: |
          $expected = '${{ needs.version.outputs.version }}.0'
          $mismatched = @()
          Get-ChildItem -Path '${{ env.ARTIFACT_OUTPUT }}' -Recurse -Filter 'SubZeroFramework*.dll' | ForEach-Object {
              try {
                  $actual = [System.Reflection.AssemblyName]::GetAssemblyName($_.FullName).Version.ToString()
              }
              catch {
                  # Not a managed assembly (or unreadable) — not this check's business.
                  return
              }
              if ($actual -ne $expected) {
                  $mismatched += "$($_.FullName) is stamped $actual"
              }
          }
          if ($mismatched.Count -gt 0) {
              Write-Host "::error::Payload assemblies disagree on the version. The app records the exact assembly version of every project reference it compiled against, and CoreCLR refuses a lower one at load time with a FileNotFoundException — so this payload would install and then fail to start."
              $mismatched | ForEach-Object { Write-Host "::error::$_ (expected $expected)" }
              exit 1
          }
          Write-Host "All SubZeroFramework assemblies in the payload are stamped $expected."

      # WiX v7 MSI. Migrated from Inno Setup 2026-07-22 (Inno 6.5+ is non-commercial-only without a paid
      # license; WiX's OSMF applies only above USD $10k annual revenue — this project accepts the EULA and
      # uses it free). The staging step exists because the .wxs harvests with a <Files> glob that cannot
      # exclude, while the two executables are authored explicitly (ServiceInstall / shortcut) — shipping
      # them twice would be a duplicate-file error.
      - name: Build Windows installer (WiX MSI)
        shell: pwsh
        run: |
          dotnet tool install --global wix
          wix eula accept wix7
          wix extension add -g WixToolset.Util.wixext
          wix extension add -g WixToolset.UI.wixext

          $payload = "${{ env.ARTIFACT_OUTPUT }}"
          $staging = "${{ github.workspace }}/msi-staging"
          & robocopy $payload $staging /E /NFL /NDL /NJH /NJS /XF 'SubZeroFramework.exe' 'SubZeroFramework.Service.exe' | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "Staging the MSI payload failed (robocopy exit $LASTEXITCODE)." }
          $global:LASTEXITCODE = 0

          # WixUI's license page needs RTF; generate from LICENSE.txt so the license has one source of truth.
          $licenseRtf = "${{ github.workspace }}/License.rtf"
          $escaped = (Get-Content LICENSE.txt -Raw).Replace('\', '\\').Replace('{', '\{').Replace('}', '\}')
          [IO.File]::WriteAllText($licenseRtf, '{\rtf1\ansi\deff0{\fonttbl{\f0 Consolas;}}\fs18 ' + (($escaped -split "\r?\n") -join '\par ') + '}')

          New-Item -ItemType Directory -Force "${{ github.workspace }}/installer" | Out-Null
          wix build packaging/windows/subzeroframework.wxs `
            -arch ${{ matrix.type }} `
            -d "Version=${{ needs.version.outputs.version }}" `
            -d "PayloadDir=$staging" `
            -d "FullPayloadDir=$payload" `
            -d "LicenseRtf=$licenseRtf" `
            -ext WixToolset.Util.wixext `
            -ext WixToolset.UI.wixext `
            -o "${{ github.workspace }}/installer/SubZeroFramework-Setup-${{ needs.version.outputs.version }}-${{ matrix.type }}.msi"
          if ($LASTEXITCODE -ne 0) { throw "WiX build failed ($LASTEXITCODE)." }

      - name: Upload Windows installer artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        continue-on-error: false
        with:
          name: SubZero Framework - Windows ${{ matrix.type }} Installer
          path: ${{ github.workspace }}/installer
          if-no-files-found: error
          retention-days: 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        continue-on-error: false
        with:
          name: SubZero Framework - Windows ${{ matrix.type }} WinUI3
          path: ${{ env.ARTIFACT_OUTPUT }}
          if-no-files-found: error
          retention-days: 1

      - name: "Cancel if failure"
        if: ${{ failure() }}
        uses: potiuk/cancel-workflow-runs@master
        with:
          cancelMode: self
          cancelFutureDuplicates: false
          selfPreservation: false
          token: ${{ secrets.GITHUB_TOKEN }}

  package_arch_binary:
    # Builds the binary Arch packages (.pkg.tar.zst) from the AUR-format PKGBUILDs emitted by the Linux
    # legs. Our package() is a pure binary repack (no compilation), so both architectures build on the
    # official x86_64 archlinux container — the aarch64 leg only needs the CARCH label overridden in
    # makepkg.conf (official Arch images are x86_64-only; Arch Linux ARM is a separate community distro).
    name: Build Arch Linux binary package (${{ matrix.type }})
    needs: [version, build_and_publish_linux]
    strategy:
      fail-fast: true
      matrix:
        include:
          - type: x64
            carch: x86_64
          - type: arm64
            carch: aarch64
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Download Linux ${{ matrix.type }} packages artifact
        uses: actions/download-artifact@v8
        with:
          name: SubZero Framework - Linux ${{ matrix.type }} Packages
          path: packages

      - name: Build package with makepkg
        run: |
          sed -i 's/^CARCH=.*/CARCH="${{ matrix.carch }}"/' /etc/makepkg.conf
          # makepkg RESOLVES runtime depends= before building and aborts on any it cannot satisfy, even
          # though package() here is a pure binary repack that compiles nothing. archlinux:base-devel
          # does not carry fontconfig/icu/libx11/..., so these must be present or the job fails the
          # moment PKGBUILD declares real dependencies. Installed as root before dropping to `builder`
          # (that user has no sudo, so it cannot install them itself via --syncdeps).
          #
          # Bring the image up to date BEFORE installing anything. Arch is a rolling release with no
          # stable-version guarantees, so `-Sy pkg` refreshes the package DB while leaving everything
          # already installed at its old version — a PARTIAL UPGRADE, which Arch explicitly does not
          # support. The container image is rebuilt periodically while the repos move continuously, so
          # as soon as a package the image ships gets rebuilt upstream, this fails:
          #   installing systemd-libs (261.2-1) breaks dependency 'systemd-libs=261.1' required by systemd
          # (the image carried systemd 261.1, which pins its -libs to that exact version, and the
          # refreshed repo only offered 261.2). Note this is timing-dependent: it comes back green on
          # its own once the image catches up, then breaks again on the next skew, so -Sy is a latent
          # failure here whatever the job's current colour.
          # No sudo: this step already runs as root — that is why it can useradd/chown below.
          pacman -Syu --noconfirm

          # base-devel is what the image is named for, but reinstall-if-missing keeps the build side
          # explicit rather than inherited. The rest MIRRORS depends= in the generated PKGBUILD
          # (packaging/linux/build-linux-packages.sh): makepkg resolves every runtime dependency before
          # it will build, even though package() here is a pure binary repack that compiles nothing.
          # They are installed as root because `builder` has no sudo and so cannot use --syncdeps.
          # Keep this list and the PKGBUILD's depends= in step; a mismatch fails at makepkg time.
          # optdepends (vulkan-icd-loader) is deliberately absent — makepkg does not resolve those.
          pacman -S --noconfirm --needed \
            base-devel \
            glibc gcc-libs systemd-libs fontconfig icu \
            libx11 libxext libxfixes libxi libxrandr libglvnd lshw
          useradd -m builder
          cp -r packages/aur /home/builder/aur
          chown -R builder:builder /home/builder/aur
          su builder -c "cd /home/builder/aur && makepkg -f --noconfirm"
          mkdir -p packages/arch
          cp /home/builder/aur/*.pkg.tar.zst packages/arch/

      - name: Upload Arch package artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        continue-on-error: false
        with:
          name: SubZero Framework - Arch Linux ${{ matrix.type }} Package
          path: packages/arch
          if-no-files-found: error
          retention-days: 1

      - name: "Cancel if failure"
        if: ${{ failure() }}
        uses: potiuk/cancel-workflow-runs@master
        with:
          cancelMode: self
          cancelFutureDuplicates: false
          selfPreservation: false
          token: ${{ secrets.GITHUB_TOKEN }}

  smoke_test_windows:
    # Startup smoke test on a clean machine: the published app must launch, create its main window, and
    # keep a responsive UI thread. Runners have no service or Framework EC, so the app landing on the
    # recovery page is the expected healthy outcome — this guards against the startup-crash/startup-hang
    # class of regressions, which real UI automation on runners cannot do much better without hardware.
    name: Windows startup smoke test (x64)
    needs: [version, build_and_publish_windows]
    runs-on: windows-latest

    steps:
      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: SubZero Framework - Windows x64 WinUI3
          path: app

      - name: Launch app and verify it stays responsive
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path app -Filter SubZeroFramework.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "SubZeroFramework.exe not found in the downloaded artifact" }
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 45
          $p.Refresh()
          if ($p.HasExited) { throw "App exited during startup with code $($p.ExitCode)" }
          if ($p.MainWindowHandle -eq 0) { throw "App is running but never created a main window" }
          if (-not $p.Responding) { throw "App main window is not responding (startup hang)" }
          Write-Host "App started, window created, UI thread responsive."
          Stop-Process -Id $p.Id -Force

      - name: "Cancel if failure"
        if: ${{ failure() }}
        uses: potiuk/cancel-workflow-runs@master
        with:
          cancelMode: self
          cancelFutureDuplicates: false
          selfPreservation: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build_and_publish_linux:
    name: Build and publish app on Linux - (${{ matrix.type }})
    needs: [version]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: Linux
            runsOn: ubuntu-latest
            platform: linux-x64
            type: x64
          - os: Linux
            runsOn: ubuntu-24.04-arm
            platform: linux-arm64
            type: arm64

    runs-on: ${{ matrix.runsOn }}

    env:
      PUBLISH_DOTNET_TARGET_FRAMEWORK: 'net10.0-desktop'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runner images are rebuilt periodically rather than continuously, so bring the host current
      # before anything runs against it. Scope note: this does NOT affect the .NET SDK or the Uno
      # workloads — those come from actions/setup-dotnet and uno-check, not from apt. What it does
      # update is the PACKAGING toolchain that build-linux-packages.sh shells out to (dpkg-deb, rpm,
      # tar, gzip), which is the part of this job apt actually owns.
      #
      # rpm is installed here rather than next to its use so there is a single apt phase per run;
      # apt-get (not apt) because apt deliberately has no stable CLI for scripts, and
      # DEBIAN_FRONTEND=noninteractive so a package with a config prompt cannot hang the runner.
      - name: Update Ubuntu packages
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo -E apt-get update
          sudo -E apt-get upgrade -y
          sudo -E apt-get install -y --no-install-recommends rpm

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install UNO.Check
        run: dotnet tool install -g uno.check

      - name: Install UNO Workloads
        run: uno-check -v --ci --non-interactive --fix --target desktop --skip vswin --skip vsmac --skip xcode --skip vswinworkloads --skip androidemulator --skip dotnetnewunotemplates

      # Skipped when the token is absent, which is every PR from a FORK: those runs get no secrets, so the
      # expression below resolves to an empty string and `dotnet nuget add source --password ""` exits 1
      # before a single project is compiled — the whole run then dies on a credential it never needed.
      # Nothing here requires the GitHub registry: every package this solution pins, FrameworkDotnet 0.8.213
      # included, resolves from nuget.org (verified with a clean package cache and nuget.org as the only
      # source). The registry stays configured for maintainer runs so a future private prerelease works, but
      # its absence must never be what fails a contributor's build.
      - name: Add GitHub Package Registry as a NuGet Source
        if: ${{ env.GITHUB_TOKEN != '' }}
        run: dotnet nuget add source --store-password-in-clear-text --name "GitHub" https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --username "${{ github.actor }}" --password "${{ env.GITHUB_TOKEN }}"

      # NOTE: do NOT add -p:TargetFrameworks here. It is a GLOBAL property, so MSBuild and NuGet flow it into
      # every ProjectReference, and net10.0-desktop is an Uno.Sdk alias that only the head understands — the
      # plain Microsoft.NET.Sdk projects (Core, GrpcContracts, Analyzers) parse "desktop" as a target platform
      # identifier and fail with NETSDK1139 before restore begins. -f alone is safe: reference resolution
      # picks each referenced project's nearest matching TFM instead of forcing the head's. The Windows job
      # never hit this only because its pinned TFM happens to be one plain SDK projects also accept.
      # -p:Configuration=Release must match the Release build below; see the note on the Windows job's
      # restore for why (Uno.Sdk conditions the DevServer package reference on $(Optimize)).
      - name: Restore
        run: |
          dotnet restore ${{ env.SOLUTION_NAME }} -v normal -r ${{ matrix.platform }} -p:Configuration=Release
          dotnet restore ${{ env.TEST_PROJECT }} -v normal -p:Configuration=Release

      - name: Build
        run: |
          dotnet build --no-restore ${{ env.SOLUTION_NAME }} -v normal -c Release -f ${{ env.PUBLISH_DOTNET_TARGET_FRAMEWORK }} -r ${{ matrix.platform }} -p:Version=${{ needs.version.outputs.version }} -p:InformationalVersion=${{ needs.version.outputs.version }}+${{ github.sha }} -p:DebugSymbols=true -p:DebugType=portable -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true
          # Version props required — see the note on the Windows job. Same shared single-TFM GrpcContracts
          # output, same clobber; this head only escapes the crash because it self-extracts one bundle.
          dotnet build --no-restore ${{ env.TEST_PROJECT }} -v normal -c Release -p:Version=${{ needs.version.outputs.version }} -p:InformationalVersion=${{ needs.version.outputs.version }}+${{ github.sha }}

      # Tests run BETWEEN build and publish, so nothing is published from a red suite. --no-build binds
      # this to the exact assemblies built above rather than rebuilding a second, unverified copy.
      # See the note on the Windows job for why TestCategory!=Hardware is excluded.
      - name: Test
        run: dotnet test --no-restore --no-build ${{ env.TEST_PROJECT }} -v normal -c Release --filter "TestCategory!=Hardware" --logger "trx;LogFileName=test-results.trx" --results-directory test-results

      # See the note on the Windows job for why always() + fail-on-error: false.
      - name: Publish test report
        if: ${{ always() }}
        uses: dorny/test-reporter@v3
        with:
          name: Tests (${{ matrix.os }} ${{ matrix.type }})
          # Workspace-RELATIVE with forward slashes, deliberately. This action globs with picomatch
          # semantics, where a backslash is an ESCAPE character, so an absolute Windows path
          # (D:\a\SubZeroFramework\...) can never match and the step fails with "No test report files
          # were found" even though dotnet test wrote the trx exactly where it was told to.
          path: test-results/*.trx
          reporter: dotnet-trx
          fail-on-error: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: Test results (${{ matrix.os }} ${{ matrix.type }})
          path: test-results
          # warn, not ignore: a silently absent trx is how the reporter's path bug hid itself.
          if-no-files-found: warn
          retention-days: 7

      - name: Publish
        run: dotnet publish --no-restore --no-build ${{ env.SOLUTION_NAME }} -v normal -c Release -f ${{ env.PUBLISH_DOTNET_TARGET_FRAMEWORK }} -r ${{ matrix.platform }}  -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:PublishDir=${{ env.ARTIFACT_OUTPUT }} -p:Version=${{ needs.version.outputs.version }} -p:InformationalVersion=${{ needs.version.outputs.version }}+${{ github.sha }} -p:DebugSymbols=true -p:DebugType=portable

      - name: Package Linux service bundle
        run: |
          chmod +x ./SubZeroFramework.Service/Scripts/package-linux-service.sh
          # 4th arg is the version — see the note on the Windows equivalent above.
          ./SubZeroFramework.Service/Scripts/package-linux-service.sh ${{ matrix.platform }} "${{ env.ARTIFACT_OUTPUT }}" Release ${{ needs.version.outputs.version }}

      # rpm and the rest of the packaging toolchain are installed/updated in the "Update Ubuntu
      # packages" step at the top of this job.
      - name: Build Linux packages (deb, rpm, Arch/AUR)
        run: |
          chmod +x ./packaging/linux/build-linux-packages.sh
          ./packaging/linux/build-linux-packages.sh \
            "${{ needs.version.outputs.version }}" \
            "${{ matrix.platform }}" \
            "${{ env.ARTIFACT_OUTPUT }}" \
            "${{ env.ARTIFACT_OUTPUT }}/service-package/linux" \
            "${{ github.workspace }}/packages"

      - name: Upload Linux packages artifact
        uses: actions/upload-artifact@v7
        continue-on-error: false
        with:
          name: SubZero Framework - Linux ${{ matrix.type }} Packages
          path: ${{ github.workspace }}/packages
          if-no-files-found: error
          retention-days: 1

      - name: Upload build artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        continue-on-error: false
        with:
          name: SubZero Framework - Linux ${{ matrix.type }} SKIA
          path: ${{ env.ARTIFACT_OUTPUT }}
          if-no-files-found: error
          retention-days: 1

      - name: "Cancel if failure"
        if: ${{ failure() }}
        uses: potiuk/cancel-workflow-runs@master
        with:
          cancelMode: self
          cancelFutureDuplicates: false
          selfPreservation: false
          token: ${{ secrets.GITHUB_TOKEN }}
