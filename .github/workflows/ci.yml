name: Build and Publish CI

on:
  push:
    branches:
      - master
      - release/**
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
      - release/**

  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write
  contents: read
  actions: write
  # dorny/test-reporter publishes the trx as a check run.
  checks: write

jobs:
  # Everything lives in the reusable workflow so this path and the release path build identically —
  # a release can never be produced by a pipeline that differs from the one that validated the commit.
  # secrets: inherit is required for GTH_EXTENDED_TOKEN (the GitHub Packages NuGet source).
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit
